<div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-4">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-white">Smart Text Formatter</h2>
    <span class="text-[10px] bg-teal-500/10 text-teal-400 px-2 py-1 rounded-lg">v1</span>
  </div>
  <p class="text-xs text-slate-400">Chuẩn hóa văn bản tiếng Việt.</p>
  <textarea id="m7-input" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200" placeholder="Dán văn bản..."></textarea>
  <div class="flex gap-2">
    <button id="m7-titleBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">Title Case</button>
    <button id="m7-upperBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">UPPER</button>
    <button id="m7-lowerBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">lower</button>
  </div>
  <textarea id="m7-output" rows="6" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200"></textarea>
</div>
