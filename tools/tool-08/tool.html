<div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-4 max-w-2xl mx-auto">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-white">Smart Image Studio</h2>
    <span class="text-[10px] bg-pink-500/10 text-pink-400 px-2 py-1 rounded-lg">v8</span>
  </div>
  <p class="text-xs text-slate-400">Cắt ảnh theo khung chuẩn, nén và chèn logo.</p>
  <input type="file" id="m8-imageInput" accept="image/*" multiple class="text-xs text-slate-300">
  <div id="m8-fileCount" class="text-xs text-slate-400"></div>
  <div id="m8-workspace" class="hidden space-y-4">
    <div class="flex flex-wrap gap-2">
      <button data-ratio="1" class="m8-ratio-btn bg-pink-600 text-xs px-3 py-1.5 rounded-lg">1:1</button>
      <button data-ratio="0.5625" class="m8-ratio-btn bg-slate-800 text-xs px-3 py-1.5 rounded-lg">9:16</button>
      <button data-ratio="1.777" class="m8-ratio-btn bg-slate-800 text-xs px-3 py-1.5 rounded-lg">16:9</button>
      <button data-ratio="free" class="m8-ratio-btn bg-slate-800 text-xs px-3 py-1.5 rounded-lg">Tự do</button>
    </div>
    <div class="relative inline-block border border-slate-700 rounded-xl overflow-hidden">
      <img id="m8-preview" class="max-h-80">
      <div id="m8-cropBox" class="absolute border-2 border-pink-400 bg-pink-400/20" style="display:none;"></div>
      <img id="m8-logoOverlay" class="absolute cursor-move" style="display:none;">
    </div>
    <div class="flex items-center gap-3 text-xs">
      <span class="text-slate-400">Chất lượng:</span>
      <input type="range" id="m8-quality" min="30" max="95" value="80" class="w-32 accent-pink-500">
      <span id="m8-qualityLabel" class="text-slate-300">80%</span>
    </div>
    <div class="flex gap-2">
      <button id="m8-previewBtn" class="bg-slate-700 text-white text-xs px-4 py-2.5 rounded-xl">Xem trước</button>
      <button id="m8-cropBtn" class="bg-pink-600 text-white text-xs px-5 py-2.5 rounded-xl">Tải xuống</button>
      <button id="m8-batchBtn" class="hidden bg-indigo-600 text-white text-xs px-4 py-2.5 rounded-xl">Xử lý tất cả</button>
    </div>
    <div id="m8-resultBox" class="hidden">
      <img id="m8-resultPreview" class="max-h-48 rounded-lg border border-slate-700">
    </div>
  </div>
</div>
