<div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-4">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-white">Instant Lead Notifier</h2>
    <span class="text-[10px] bg-purple-500/10 text-purple-400 px-2 py-1 rounded-lg">v1</span>
  </div>
  <p class="text-xs text-slate-400">Gửi thông báo lead mới qua Telegram.</p>
  <input id="m3-token" placeholder="Bot Token" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200">
  <input id="m3-chatid" placeholder="Chat ID" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200">
  <textarea id="m3-message" rows="4" placeholder="Nội dung thông báo" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200"></textarea>
  <button id="m3-sendBtn" class="bg-purple-600 hover:bg-purple-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl">Gửi</button>
</div>
