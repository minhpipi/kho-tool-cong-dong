<div class="bg-slate-900/60 border border-slate-800 rounded-3xl p-6 sm:p-8 space-y-4">
  <div class="flex items-center justify-between">
    <h2 class="text-xl font-bold text-white">Smart Data Cleaner</h2>
    <span class="text-[10px] bg-cyan-500/10 text-cyan-400 px-2 py-1 rounded-lg">v2</span>
  </div>
  <p class="text-xs text-slate-400">Dán danh sách số điện thoại hỗn loạn. Tool sẽ lọc và xóa trùng.</p>
  <textarea id="m1-input" rows="6" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200" placeholder="Dán danh sách số điện thoại..."></textarea>
  <button id="m1-cleanBtn" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold text-xs px-5 py-2.5 rounded-xl">Lọc sạch</button>
  <div id="m1-result" class="hidden space-y-2">
    <div class="text-xs text-slate-400">Kết quả:</div>
    <textarea id="m1-output" rows="6" readonly class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-slate-200"></textarea>
    <button id="m1-copyBtn" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg">Sao chép</button>
  </div>
</div>
